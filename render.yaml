# Render Blueprint — Telecom Customer Intelligence Platform API
#
# One-click deployment from the Render dashboard: connect the GitHub repo
# (yogita-0204/telecom-reten-2.0) and Render applies this file -> the web
# service is created with the exact build/start commands below.
#
# The pipeline artifacts (data/processed/*, models/*) are baked into the
# image at BUILD time (build instances have far more memory than the 512 MB
# free runtime, so random-forest + SHAP training is safe there). At runtime
# /predict loads them immediately — the on-demand bootstrap in api/main.py
# is only a fallback for a fresh checkout.

services:
  - type: web
    name: telecom-reten-2-0
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python -m src.run_pipeline
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PIP_NO_CACHE_DIR
        value: "1"