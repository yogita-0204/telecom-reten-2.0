# Render Blueprint — Telecom Customer Intelligence Platform API
#
# One-click deployment from the Render dashboard: connect the GitHub repo
# (yogita-0204/telecom-reten-2.0) and Render applies this file -> the web
# service is created with the exact build/start commands below.
#
# Pipeline artifacts (data/processed/*, models/*) are committed, so the build
# is a plain dependency install and /predict serves immediately. The on-demand
# bootstrap in api/main.py remains as a clean-checkout fallback, and running
# the pipeline only costs a minute if it is ever needed.

services:
  - type: web
    name: telecom-reten-2-0
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      # Cap glibc malloc arenas: the free tier has one small container, and
      # unbounded arenas are a classic source of needless RSS growth in
      # Python/NumPy processes. 2 arenas trade a sliver of speed for a
      # meaningful memory cushion.
      - key: MALLOC_ARENA_MAX
        value: "2"